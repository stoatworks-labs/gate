  <body>
    <main id="demo">
      <noscript>
        <h1>Gate</h1>
        <p>
          An FFGL effect that runs your clip through a film projector's gate,
          shutter and print, modelling the machine and letting the look follow.
          The clip is held at the projector's rate and only changes when the
          claw pulls down, in the dark. The light the shutter blades let through
          is integrated over each frame your display shows, so the flicker beats
          at the difference between the two rates. Each frame lands in the gate
          with its own correlated weave, and every mark belongs to either the
          print or the gate: scratches that stay put while the picture moves
          under them, dust that rides the print, a hair caught at the aperture,
          splices, reel-change cue dots, and dyes fading towards magenta.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/gate">its repository</a>.
        </p>
