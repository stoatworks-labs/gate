name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. Both jobs build the OpenFX plugin too (BUILD_OFX is ON by default). The
# Linux OpenFX build and its load test on Rocky 8 live in release.yml, which a
# workflow_dispatch runs without publishing anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # GATE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # gatest is the only place the projector is written down as a number,
        # so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DGATE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/gatest --list

      - name: OpenFX bundle
        # What tools/verify.sh checks locally, minus the render (ofxprobe lives
        # in another repo): the plist names the binary that is on disk, the
        # binary exports OfxGetPlugin, and the bundle ad-hoc signs -- the
        # command the release job runs, which is where a wrong
        # CFBundleExecutable would otherwise first fail.
        shell: bash
        run: |
          bundle=build/Gate.ofx.bundle
          exe=$( /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist" )
          test -f "$bundle/Contents/MacOS/$exe" || { echo "CFBundleExecutable '$exe' is not in the bundle"; exit 1; }
          __symbols=$( nm -gU "$bundle/Contents/MacOS/$exe" )
          case "$__symbols" in
            *_OfxGetPlugin*) echo "exports OfxGetPlugin" ;;
            *) echo "expected _OfxGetPlugin, got: $__symbols"; exit 1 ;;
          esac
          cp -R "$bundle" "$RUNNER_TEMP/"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/Gate.ofx.bundle"

      - name: Physics
        # The runner has no accelerated GL; the harness falls back to a
        # software context, which is not bit-repeatable. 320x180, because
        # software rasterisation is slow and every check here was written to
        # hold at any raster; verify.sh runs them at 1280x720 as well, and on
        # this Mac's software renderer.
        timeout-minutes: 40
        run: |
          ./build/gatest --names
          ./build/gatest --flicker  --size 320x180
          ./build/gatest --hold     --size 320x180
          ./build/gatest --scratch  --size 320x180
          ./build/gatest --weave    --size 320x180
          ./build/gatest --fade     --size 320x180
          ./build/gatest --resize   --size 320x180
          ./build/gatest --negative --size 320x180

      - name: Controls
        # At 160x90 and two at a time, because the runner has no GPU and the
        # question is only whether a control changed ANY subpixel. Graticule's
        # first run of this step at 320x180 was still going at twenty minutes.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 160x90 --jobs 2

      - uses: actions/upload-artifact@v7
        with:
          name: gate-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DGATE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: OpenFX plugin
        # Win64 is where the OpenFX target's output directory has to be pinned
        # per configuration, and where its import library races the FFGL
        # target's (LNK1104) if it is not given its own.
        shell: bash
        run: test -f build/Gate.ofx.bundle/Contents/Win64/Gate.ofx

      - uses: actions/upload-artifact@v7
        with:
          name: gate-windows-x86_64
          path: |
            build/Release/*.dll
            build/Gate.ofx.bundle/Contents/Win64/Gate.ofx
          if-no-files-found: error
